<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — YourSite</title>
  <meta name="description" content="Contact form to reach me for work or questions." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.ico" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html">YourSite</a>
      <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-controls="primaryNav">Menu</button>
      <nav id="primaryNav" class="nav" role="navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <h1>Contact</h1>
    <form id="contactForm" class="form" novalidate>
      <label>
        Name
        <input id="name" name="name" type="text" required placeholder="Your full name" />
        <span class="error" id="errName" aria-live="polite"></span>
      </label>
      <label>
        Email
        <input id="email" name="email" type="email" required placeholder="you@example.com" />
        <span class="error" id="errEmail" aria-live="polite"></span>
      </label>
      <label>
        Message
        <textarea id="message" name="message" rows="6" required placeholder="Tell me about your project..."></textarea>
        <span class="error" id="errMessage" aria-live="polite"></span>
      </label>
      <p><button type="submit" class="btn">Send message</button></p>
      <div id="formResult" role="status" aria-live="polite"></div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Your Name</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
